[workspace]
resolver = "3"
members = [
    "crates/crawler-core",
    "crates/crawler-engine",
    "crates/crawler-fetch",
    "crates/crawler-parser",
    "crates/crawler-cli",
    "crates/crawler-test-site",
    "crates/crawler-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
chrono = {version = "0.4", features = ["serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sqlx = {version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
]}
uuid = {version = "1", features = ["serde", "v4"]}
thiserror = "2"
reqwest = { version = "0.13.4", features = ["json"] }
scraper = "0.27.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
