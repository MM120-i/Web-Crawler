name: ci-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler_dev_password
          POSTGRES_DB: crawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s
    env:
      DATABASE_URL: postgres://crawler:crawler_dev_password@localhost:5432/crawler
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --verbose

  release-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release
